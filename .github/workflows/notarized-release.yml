name: Notarized Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: notarized-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-notarize-release:
    runs-on: [self-hosted, macOS, ARM64, okrapdf-desktop-release]
    timeout-minutes: 45
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          [[ "${TAG}" == desktop-v* ]]
          VERSION="${TAG#desktop-v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          # Monotonic integer CFBundleVersion / sparkle:version for Sparkle.
          echo "build_number=$(date -u +%Y%m%d%H%M)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          ORIGINAL_KEYCHAIN_LIST_PATH="${RUNNER_TEMP}/original-user-keychains.txt"

          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*"//' -e 's/"$//' \
            > "${ORIGINAL_KEYCHAIN_LIST_PATH}"

          if [[ "${CSC_LINK}" == https://* ]]; then
            curl --fail --silent --show-error --location "${CSC_LINK}" --output "${CERTIFICATE_PATH}"
          else
            CERTIFICATE_DATA="${CSC_LINK#*,}"
            printf '%s' "${CERTIFICATE_DATA}" | base64 -D > "${CERTIFICATE_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CSC_KEY_PASSWORD}" \
            -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r KEYCHAIN; do
            if [[ -n "${KEYCHAIN}" ]]; then
              ORIGINAL_KEYCHAINS+=("${KEYCHAIN}")
            fi
          done < "${ORIGINAL_KEYCHAIN_LIST_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${ORIGINAL_KEYCHAINS[@]}"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [[ -z "${SIGNING_IDENTITY}" ]]; then
            echo "Developer ID Application identity is missing from CSC_LINK" >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          echo "RELEASE_ORIGINAL_KEYCHAIN_LIST_PATH=${ORIGINAL_KEYCHAIN_LIST_PATH}" >> "${GITHUB_ENV}"

      - name: Test and build signed app
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-brand-surface.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s scripts/tests \
            -p '*_tests.py'
          swift test
          ./scripts/build-dmg.sh \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.build_number }}" \
            --app-only
          codesign --verify --strict --deep "build/Okra.app"
          codesign --display --verbose=4 "build/Okra.app" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier=|Runtime Version='
          [[ "$(lipo -archs build/Okra.app/Contents/MacOS/Okra)" == "arm64" ]]
          RELEASE_BIN_PATH="$(swift build -c release --show-bin-path)"
          OKRA_DESKTOP_PACKAGED_APP_PATH="${PWD}/build/Okra.app" \
          OKRA_DESKTOP_RESOURCE_BUNDLE_FALLBACK_PATH="${RELEASE_BIN_PATH}/okraPDF_Okra.bundle" \
            swift test --filter PackagedAppLaunchTests.packagedAppRemainsAlive

      - name: Notarize and staple app
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "build/Okra.app" "${RUNNER_TEMP}/Okra.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/Okra.zip" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait 2>&1 | tee "${RUNNER_TEMP}/notary-submit.log"
          xcrun stapler staple "build/Okra.app"
          xcrun stapler validate "build/Okra.app"

      - name: Dump notarization log on failure
        if: failure() && steps.notarize.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          SUBMISSION_ID="$(awk '/^  id: /{print $2; exit}' "${RUNNER_TEMP}/notary-submit.log" 2>/dev/null)"
          if [[ -z "${SUBMISSION_ID}" ]]; then
            echo "No notary submission id captured"
            exit 0
          fi
          xcrun notarytool log "${SUBMISSION_ID}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" || true

      - name: Package, notarize, and verify DMG
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          DMG="build/Okra-${VERSION}.dmg"
          ./scripts/package-dmg.sh "build/Okra.app" "${DMG}"
          codesign --force --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${DMG}"
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"
          hdiutil verify "${DMG}"
          spctl --assess --type execute --verbose=4 "build/Okra.app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${DMG}"
          RELEASE_BIN_PATH="$(swift build -c release --show-bin-path)"
          OKRA_DESKTOP_PACKAGED_DMG_PATH="${PWD}/${DMG}" \
          OKRA_DESKTOP_RESOURCE_BUNDLE_FALLBACK_PATH="${RELEASE_BIN_PATH}/okraPDF_Okra.bundle" \
            swift test --filter PackagedAppLaunchTests.quarantinedDMGLaunchesThroughLaunchServices
          shasum -a 256 "${DMG}" | sed 's#  build/#  #' > "${DMG}.sha256"
          echo "dmg=${DMG}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${DMG}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          NOTES="RELEASE_NOTES-v${VERSION}.md"
          DMG="${{ steps.artifact.outputs.dmg }}"
          CHECKSUM="${{ steps.artifact.outputs.checksum }}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${DMG}" "${CHECKSUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "okraPDF Desktop v${VERSION}" \
              --notes-file "${NOTES}" \
              --prerelease \
              --latest=false
          else
            gh release create "${TAG}" "${DMG}" "${CHECKSUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "okraPDF Desktop v${VERSION}" \
              --notes-file "${NOTES}" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

      - name: Sign update and publish appcast branch
        id: appcast
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          BUILD_NUMBER="${{ steps.release.outputs.build_number }}"
          DMG="${{ steps.artifact.outputs.dmg }}"

          SPARKLE_TOOLS="${RUNNER_TEMP}/sparkle-tools"
          mkdir -p "${SPARKLE_TOOLS}"
          curl --fail --silent --show-error --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            | tar -xJ -C "${SPARKLE_TOOLS}"

          ED_SIGNATURE="$(printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" \
            | "${SPARKLE_TOOLS}/bin/sign_update" --ed-key-file - -p "${DMG}")"
          DMG_LENGTH="$(stat -f%z "${DMG}")"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          ENCLOSURE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Okra-${VERSION}.dmg"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=50 origin main
          git checkout -B main FETCH_HEAD

          python3 scripts/insert-appcast-item.py \
            --appcast appcast.xml \
            --version "${VERSION}" \
            --build-number "${BUILD_NUMBER}" \
            --tag "${TAG}" \
            --pub-date "${PUB_DATE}" \
            --enclosure-url "${ENCLOSURE_URL}" \
            --ed-signature "${ED_SIGNATURE}" \
            --length "${DMG_LENGTH}"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('appcast.xml')"

          git add appcast.xml
          git commit -m "appcast: publish desktop-v${VERSION} (build ${BUILD_NUMBER})"
          APPCAST_BRANCH="automation/appcast-${TAG}-${BUILD_NUMBER}-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${APPCAST_BRANCH}"
          echo "branch=${APPCAST_BRANCH}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Signed appcast ready"
            echo
            echo "Open a pull request from \`${APPCAST_BRANCH}\` to \`main\`."
            echo "The normal \`macos-checks\` branch-protection gate must pass before merge."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${RELEASE_KEYCHAIN_PATH}" || true
          fi
          if [[ -f "${RELEASE_ORIGINAL_KEYCHAIN_LIST_PATH:-}" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r KEYCHAIN; do
              if [[ -n "${KEYCHAIN}" ]]; then
                ORIGINAL_KEYCHAINS+=("${KEYCHAIN}")
              fi
            done < "${RELEASE_ORIGINAL_KEYCHAIN_LIST_PATH}"
            if [[ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"
            fi
          fi
